<!doctype html>
<html lang="en" data-theme="goldenhour">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PuppyFinder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Nunito+Sans:opsz,wght@6..12,400..800&display=swap"
      rel="stylesheet"
    />
    <script>
      const saved = localStorage.getItem('puppyfinder-theme')
      // Only brand themes exist now; ignore stale picks from the old multi-theme picker.
      // With no saved pick, follow the system preference: the hardcoded light default meant
      // a dark-mode visitor's first impression was a bright page and a ☀️ icon.
      if (saved && saved.startsWith('goldenhour')) document.documentElement.dataset.theme = saved
      else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'goldenhour-dark'
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
